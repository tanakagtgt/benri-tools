<script>
/* =====================================================
   定数・状態管理
   ===================================================== */
const CURRENT_TOOL_ID = 'mp3bunkatsu';

const state = {
  file: null,            // 選択されたFile
  duration: 0,           // 音声の総再生時間（秒）
  splitPoints: [],       // 分割秒数（配列）
  wavesurfer: null,      // WaveSurferインスタンス
  ffmpeg: null           // FFmpegインスタンス
};

/* =====================================================
   初期化
   ===================================================== */
document.addEventListener('DOMContentLoaded', () => {
  loadRecommends();
  initDragAndDrop();
  initWaveSurfer();
});

/* =====================================================
   WaveSurfer.js の初期化
   ===================================================== */
function initWaveSurfer() {
  state.wavesurfer = WaveSurfer.create({
    container: '#waveform',
    waveColor: '#c3d4f8',
    progressColor: '#1a56db',
    cursorColor: '#1a56db',
    barWidth: 2,
    barRadius: 3,
    height: 70,
    responsive: true
  });

  // 再生時間の動的表示
  state.wavesurfer.on('timeupdate', (currentTime) => {
    document.getElementById('currentTime').textContent = formatTime(currentTime);
  });

  // 音声ファイルロード完了時
  state.wavesurfer.on('ready', () => {
    state.duration = state.wavesurfer.getDuration();
    document.getElementById('fileDuration').textContent = formatTime(state.duration);
    document.getElementById('totalTime').textContent = formatTime(state.duration);
    document.getElementById('playerContainer').style.display = 'block';
    document.getElementById('splitSection').style.display = 'block';
  });

  // 再生終了時
  state.wavesurfer.on('finish', () => {
    document.getElementById('btnPlayPause').textContent = '▶ 再生';
  });
}

/* =====================================================
   ドラッグ＆ドロップ関連
   ===================================================== */
function initDragAndDrop() {
  const dropZone = document.getElementById('dropZone');

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
    }, false);
  });

  ['dragenter', 'dragover'].forEach(eventName => {
    dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
  });

  ['dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
  });

  dropZone.addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    const files = dt.files;
    if (files.length > 0) processFile(files[0]);
  });
}

function handleFileSelect(e) {
  const files = e.target.files;
  if (files.length > 0) processFile(files[0]);
}

/* =====================================================
   ファイル検証・読み込み処理
   ===================================================== */
function processFile(file) {
  hideError();
  
  // MP3フォーマットチェック
  if (!file.type.includes('audio/mpeg') && !file.name.toLowerCase().endsWith('.mp3')) {
    showError('MP3形式のファイルを選択してください。');
    return;
  }

  state.file = file;
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileInfo').style.display = 'flex';

  // WaveSurferに読み込む
  const objectUrl = URL.createObjectURL(file);
  state.wavesurfer.load(objectUrl);
}

/* =====================================================
   再生・一時停止の切り替え
   ===================================================== */
function togglePlay() {
  if (!state.wavesurfer) return;
  state.wavesurfer.playPause();
  const isPlaying = state.wavesurfer.isPlaying();
  document.getElementById('btnPlayPause').textContent = isPlaying ? '⏸ 一時停止' : '▶ 再生';
}

/* =====================================================
   分割ポイントの管理（追加・削除・ソート描画）
   ===================================================== */
function addSplitPoint() {
  if (!state.file) return;

  const current = state.wavesurfer.getCurrentTime();
  
  // 開始・終了ギリギリの位置や重複の防止
  if (current <= 0 || current >= state.duration) return;
  if (state.splitPoints.includes(current)) return;

  state.splitPoints.push(current);
  // 昇順で自動ソート
  state.splitPoints.sort((a, b) => a - b);
  
  renderSplitPoints();
  hideError();
}

function removeSplitPoint(index) {
  state.splitPoints.splice(index, 1);
  renderSplitPoints();
}

function renderSplitPoints() {
  const container = document.getElementById('splitList');
  container.innerHTML = '';

  if (state.splitPoints.length === 0) {
    container.innerHTML = '<div class="empty-list-msg">分割ポイントが設定されていません</div>';
    return;
  }

  state.splitPoints.forEach((pointSec, idx) => {
    const item = document.createElement('div');
    item.className = 'split-item';
    item.innerHTML = `
      <span>ポイント ${idx + 1}: ${formatTime(pointSec)}</span>
      <button class="btn-del" onclick="removeSplitPoint(${idx})">削除</button>
    `;
    container.appendChild(item);
  });
}

/* =====================================================
   FFmpeg.wasm によるブラウザ内高速切り出し
   ===================================================== */
async function exportMP3Files() {
  hideError();

  if (!state.file) {
    showError('ファイルを選択してください。');
    return;
  }

  if (state.splitPoints.length === 0) {
    showError('分割ポイントを追加してください。');
    return;
  }

  const progressWrap = document.getElementById('progressWrap');
  progressWrap.style.display = 'block';
  updateProgress(0, 'FFmpegエンジン起動中...');

  try {
    // FFmpeg.wasmの初期化・ロード（初回のみ）
    if (!state.ffmpeg) {
      const { createFFmpeg } = FFmpeg;
      state.ffmpeg = createFFmpeg({ log: false });
      await state.ffmpeg.load();
    }

    const ffmpeg = state.ffmpeg;
    const arrayBuffer = await state.file.arrayBuffer();
    const uint8Array = new Uint8Array(arrayBuffer);

    // インメモリFSに原書MP3を書き込み
    const inFileName = 'input.mp3';
    ffmpeg.FS('writeFile', inFileName, uint8Array);

    // 分割タイムラインの作成 [0秒, ...分割点, 最終秒]
    const timeline = [0, ...state.splitPoints, state.duration];
    const baseName = state.file.name.replace(/\.[^/.]+$/, "");

    // 順次切り出し
    for (let i = 0; i < timeline.length - 1; i++) {
      const start = timeline[i];
      const end = timeline[i + 1];
      const duration = end - start;
      const indexStr = String(i + 1).padStart(3, '0');
      const outFileName = `${baseName}_${indexStr}.mp3`;

      updateProgress(
        Math.round((i / (timeline.length - 1)) * 100),
        `書き出し中 (${i + 1}/${timeline.length - 1}): ${outFileName}`
      );

      // FFmpegコマンドを実行 (再エンコードなしで超高速切り出し -c copy)
      await ffmpeg.run(
        '-ss', start.toFixed(3),
        '-i', inFileName,
        '-t', duration.toFixed(3),
        '-c', 'copy',
        outFileName
      );

      // 仮想ファイルからデータ取得＆自動個別ダウンロード発動
      const outData = ffmpeg.FS('readFile', outFileName);
      downloadBlob(new Blob([outData.buffer], { type: 'audio/mp3' }), outFileName);

      // メモリ解放
      ffmpeg.FS('unlink', outFileName);
    }

    // 元ファイルのクリーンアップ
    ffmpeg.FS('unlink', inFileName);

    updateProgress(100, '分割・書き出しが完了しました！');
    setTimeout(() => { progressWrap.style.display = 'none'; }, 3000);

  } catch (err) {
    console.error(err);
    showError('処理中にエラーが発生しました。ブラウザを最新にして再試行してください。');
    progressWrap.style.display = 'none';
  }
}

/* =====================================================
   ヘルパー関数群
   ===================================================== */
// 秒数を hh:mm:ss 形式へフォーマット
function formatTime(seconds) {
  if (isNaN(seconds)) return '00:00:00';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
}

// プログレスバーの更新
function updateProgress(percent, text) {
  document.getElementById('progressBar').style.width = percent + '%';
  document.getElementById('progressText').textContent = text;
}

// Blob要素を個別にダウンロード
function downloadBlob(blob, fileName) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// エラー通知
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('errorMsg').classList.remove('show');
}

/* =====================================================
   一括リセット処理
   ===================================================== */
function resetAll() {
  if (state.wavesurfer) {
    state.wavesurfer.empty();
  }
  state.file = null;
  state.duration = 0;
  state.splitPoints = [];

  document.getElementById('fileInput').value = '';
  document.getElementById('fileInfo').style.display = 'none';
  document.getElementById('playerContainer').style.display = 'none';
  document.getElementById('splitSection').style.display = 'none';
  document.getElementById('btnPlayPause').textContent = '▶ 再生';
  
  renderSplitPoints();
  hideError();
}

/* =====================================================
   ナビ・おすすめ・シェア機能
   ===================================================== */
async function loadRecommends() {
  try {
    const res = await fetch('/tools.json');
    const tools = await res.json();
    const others = tools.filter(t => t.id !== CURRENT_TOOL_ID);
    const picks = others.sort(() => Math.random() - 0.5).slice(0, 2);
    const html = picks.length > 0
      ? picks.map(t => `<a class="recommend-link" href="${t.url}">${t.emoji} ${t.name}</a>`).join('')
      : '';
    document.getElementById('recommendLinks').innerHTML = html;
    document.getElementById('recommendLinks2').innerHTML = html;
  } catch (e) {
    document.getElementById('recommendLinks').textContent = '';
    document.getElementById('recommendLinks2').textContent = '';
  }
}

function buildShareUrl() {
  return location.href.split('?')[0];
}

function buildShareText() {
  return `【MP3分割ツール】ブラウザ上で音声を安全にカット・保存できる無料ツールです！`;
}

function shareUrl() {
  const url = buildShareUrl();
  const btn = document.getElementById('btnShareUrl');
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = '✅ コピー！';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '🔗 URLコピー';
      btn.classList.remove('copied');
    }, 2500);
  });
}

function shareX() {
  const text = buildShareText() + '\n' + buildShareUrl();
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');
}

function shareLine() {
  const text = buildShareText() + '\n' + buildShareUrl();
  window.open(`https://line.me/R/msg/text/${encodeURIComponent(text)}`, '_blank');
}

function showQr() {
  const url = buildShareUrl();
  document.getElementById('qrModalOverlay').classList.add('show');
  document.getElementById('qrUrl').textContent = url;
  const canvas = document.getElementById('qrCanvas');
  canvas.innerHTML = '';
  new QRCode(canvas, { text: url, width: 200, height: 200 });
}

function hideQr() {
  document.getElementById('qrModalOverlay').classList.remove('show');
}

function closeQrOnOverlay(e) {
  if (e.target === document.getElementById('qrModalOverlay')) hideQr();
}
