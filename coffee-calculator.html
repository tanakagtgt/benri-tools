<meta property="og:description" content="コーヒー豆の量から作れるコーヒー量を計算。出来上がり量から必要なコーヒー豆量やお湯量も自動計算できる無料ツール。">

<style>
/* =====================================================
   ★ツール固有CSS（common.cssに無い要素だけ最小限追加）
   共通化候補メモ：単位バッジ／区切り線は他ツールでも使うなら
   将来common.cssへ移設してOK（今はYAGNIでツール側に留める）
   ===================================================== */

/* 入力欄の右側に単位（g / ml）を重ねて表示 */
.unit-input-wrap { position: relative; }
.unit-input-wrap input { padding-right: 44px; }
.unit-badge {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  font-weight: 700;
  color: var(--color-text-muted);
  pointer-events: none; /* クリックをinputに通す */
}

/* 「または」区切り線（入力欄と入力欄の間） */
.or-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px 0;
  font-size: 11px;
  font-weight: 700;
  color: var(--color-text-label);
  letter-spacing: 0.1em;
}
.or-divider::before,
.or-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--color-border);
}

/* 濃度ボタン内の比率サブテキスト（例：1:15） */
.strength-ratio-sub {
  display: block;
  font-size: 10px;
  font-weight: 400;
  margin-top: 2px;
  opacity: 0.75;
}

/* 注意書きボックス */
.note {
  font-size: 11px;
  color: var(--color-text-muted);
  line-height: 1.7;
  padding: 12px 14px;
  background: var(--color-input-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-input);
  margin-bottom: 14px;
}
</style>

</head>
<body>
<div class="container">

  <!-- ナビ：ツール一覧に戻るボタン＋おすすめツール（共通・触らない） -->
  <div id="topNavSlot"></div>

  <!-- ヘッダー -->
  <header>
    <h1>☕ コーヒー豆は何グラム必要かな？</h1>
    <p class="subtitle">
      豆の量 → 出来上がり量を計算<br>
      出来上がり量 → 必要な豆の量を計算
    </p>
  </header>

  <!-- =====================================================
       濃度選択カード
       - common.cssの.toggle-wrap/.toggle-btnを流用（3択）
       - common.jsのsetToggle()は2択専用のため、切替処理は下部scriptで個別実装
       ===================================================== -->
  <div class="card">
    <div class="section-title">▶ 抽出の濃さ</div>
    <div class="toggle-wrap" id="strengthWrap">
      <button type="button" class="toggle-btn" data-strength="18" onclick="setStrength(18)">
        薄め<span class="strength-ratio-sub">1:18</span>
      </button>
      <button type="button" class="toggle-btn active" data-strength="15" onclick="setStrength(15)">
        標準<span class="strength-ratio-sub">1:15</span>
      </button>
      <button type="button" class="toggle-btn" data-strength="13" onclick="setStrength(13)">
        濃いめ<span class="strength-ratio-sub">1:13</span>
      </button>
    </div>
  </div>

  <!-- =====================================================
       入力カード
       - 豆(g)／出来上がり量(ml)のどちらか一方を入力する仕様
       - 最後に入力した方をhiddenLastInputに記録し、計算式を決定
       ===================================================== -->
  <div class="card">
    <div class="section-title">▶ どちらかを入力してね</div>

    <div class="input-group">
      <label for="input-beans">コーヒー豆の量</label>
      <div class="unit-input-wrap">
        <input type="number" id="input-beans" inputmode="decimal" min="0" step="0.1"
               placeholder="例：20" oninput="handleBeansInput()">
        <span class="unit-badge">g</span>
      </div>
    </div>

    <div class="or-divider">または</div>

    <div class="input-group" style="margin-bottom:0;">
      <label for="input-volume">出来上がり量</label>
      <div class="unit-input-wrap">
        <input type="number" id="input-volume" inputmode="decimal" min="0" step="1"
               placeholder="例：270" oninput="handleVolumeInput()">
        <span class="unit-badge">ml</span>
      </div>
    </div>

    <!-- 内部状態の保持用（非表示）。common.jsのSTORAGE_FIELDSで自動保存・復元される -->
    <input type="hidden" id="hiddenLastInput" value="">
    <input type="hidden" id="hiddenStrength" value="15">

    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- =====================================================
       結果パネル
       - main：必要な豆の量（このツールの主目的の答え）
       - bA／bB：お湯の量／出来上がり量
       - bC：選択中の抽出比率（テキスト表示）
       ===================================================== -->
  <div class="result-panel">
    <div class="result-main">
      <div class="result-label">必要なコーヒー豆の量</div>
      <div>
        <span class="result-number placeholder" id="resultNum">—</span>
        <span class="result-unit">g</span>
      </div>
    </div>
    <div class="breakdown-wrap">
      <div class="breakdown">
        <div class="breakdown-item">
          <div class="b-num placeholder" id="bA">—</div>
          <div class="b-label">お湯の量(ml)</div>
        </div>
        <div class="breakdown-item">
          <div class="b-num placeholder" id="bB">—</div>
          <div class="b-label">出来上がり量(ml)</div>
        </div>
        <div class="breakdown-item">
          <div class="b-num placeholder" id="bC">—</div>
          <div class="b-label">抽出比率</div>
        </div>
      </div>

      <!-- 結果アクションボタン（共通処理はcommon.js側、書き換え不要） -->
      <div class="copy-actions">
        <button class="btn-action" id="btnCopyText" onclick="copyResultText()" disabled>📄 テキストでコピー</button>
        <button class="btn-action" id="btnCopyUrlInputs" onclick="copyResultUrlInputs()" disabled>🔗 入力値URLコピー</button>
        <button class="btn-action" id="btnQrInputs" onclick="showQrInputs()" disabled>📷 QRで送る</button>
        <button class="btn-action" id="btnCopyExcel" onclick="copyResultExcel()" disabled>📊 Excel用コピー</button>
      </div>
    </div>
  </div>

  <!-- 注意書き -->
  <div class="note">
    ※ 豆1gにつき約2mlのお湯を吸収する前提で計算しています。<br>
    ※ 実際の出来上がり量は豆の種類や挽き方によって異なります。
  </div>

  <!-- シェアエリア（共通・触らない） -->
  <div id="shareAreaSlot"></div>

  <!-- リセットボタン（共通・触らない） -->
  <div id="resetBtnSlot"></div>

  <!-- 下部ナビ（共通・触らない） -->
  <div id="bottomNavSlot"></div>

  <!-- 広告エリア（共通・触らない） -->
  <div id="adAreaSlot"></div>

</div><!-- /.container -->

<!-- QRコードモーダル（共通・触らない） -->
<div id="qrModalSlot"></div>

<!-- フッター（共通・触らない） -->
<div id="footerSlot"></div>

<!-- ★共通JS -->
<script src="/common.js"></script>

<!-- =====================================================
     ★ここから下がツール固有部分
     ===================================================== -->
<script>
/* =====================================================
   設定
   ===================================================== */
const CURRENT_TOOL_ID = 'coffee-calculator';
const STORAGE_KEY = 'coffee-calculator_inputs';

// hiddenLastInput／hiddenStrengthも含めて保存・復元対象にする
const STORAGE_FIELDS = ['input-beans', 'input-volume', 'hiddenLastInput', 'hiddenStrength'];

// テキスト／Excelコピー用ラベル（内部管理用のhiddenフィールドは含めない）
const INPUT_LABELS = {
  'input-beans': 'コーヒー豆の量(g)',
  'input-volume': '出来上がり量(ml)',
};

// 結果表示用ラベル
const RESULT_LABELS = {
  main: '必要なコーヒー豆の量',
  subA: 'お湯の量',
  subB: '出来上がり量',
  subC: '抽出比率',
};

// 豆1gあたりが吸収するお湯の量(ml)。ドリップ抽出の一般的な目安値
const ABSORPTION_RATE = 2;

/* =====================================================
   【入力取得】
   ===================================================== */
function calculateInputs() {
  return {
    beans: parseFloat(document.getElementById('input-beans').value),
    volume: parseFloat(document.getElementById('input-volume').value),
    lastInput: document.getElementById('hiddenLastInput').value,
    ratio: parseFloat(document.getElementById('hiddenStrength').value),
  };
}

/* 小数第1位で四捨五入 */
function round1(val) {
  return Math.round(val * 10) / 10;
}

/* =====================================================
   【計算】
   ・豆(g)入力時 → お湯量／出来上がり量を算出
   ・出来上がり量(ml)入力時 → 逆算して豆量／お湯量を算出
   ・どちらも未入力／0以下の場合はnull（common.jsが自動でプレースホルダー表示に戻す）
   ===================================================== */
function calculateResult(inputs) {
  const { beans, volume, lastInput, ratio } = inputs;

  let beansResult, waterResult, outputResult;

  if (lastInput === 'beans') {
    if (isNaN(beans) || beans <= 0) return null;
    beansResult = beans;
    waterResult = beans * ratio;
    outputResult = waterResult - beans * ABSORPTION_RATE;

  } else if (lastInput === 'volume') {
    if (isNaN(volume) || volume <= 0) return null;
    beansResult = volume / (ratio - ABSORPTION_RATE);
    waterResult = beansResult * ratio;
    outputResult = volume;

  } else {
    // どちらも未入力
    return null;
  }

  return {
    main: round1(beansResult),
    subA: round1(waterResult),
    subB: round1(outputResult),
    subC: `1:${ratio}`,
  };
}

/* =====================================================
   【表示】
   ===================================================== */
function displayResult(result) {
  const numEl = document.getElementById('resultNum');
  numEl.textContent = result.main.toLocaleString();
  numEl.classList.remove('placeholder');

  const bAEl = document.getElementById('bA');
  bAEl.textContent = result.subA.toLocaleString();
  bAEl.classList.remove('placeholder');

  const bBEl = document.getElementById('bB');
  bBEl.textContent = result.subB.toLocaleString();
  bBEl.classList.remove('placeholder');

  const bCEl = document.getElementById('bC');
  bCEl.textContent = result.subC; // 文字列（例：1:15）のためtoLocaleString不要
  bCEl.classList.remove('placeholder');

  ['btnCopyText', 'btnCopyUrlInputs', 'btnQrInputs', 'btnCopyExcel'].forEach(id => {
    document.getElementById(id).disabled = false;
  });
}

/* =====================================================
   【濃度ボタン切り替え】
   ・common.jsのsetToggle()は2択専用（toggleA/toggleB固定）のため
     3択のこのツールでは個別に実装する
   ===================================================== */
function setStrength(value) {
  document.getElementById('hiddenStrength').value = value;
  syncStrengthButtons();
  onInputChange();
}

/* ボタンのactive表示を、hiddenStrengthの現在値に合わせて同期 */
function syncStrengthButtons() {
  const val = document.getElementById('hiddenStrength').value || '15';
  document.querySelectorAll('#strengthWrap .toggle-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.strength === val);
  });
}

/* =====================================================
   【入力欄の切り替えトラッキング】
   ・最後に入力した方をhiddenLastInputへ記録 → 計算式の判定に使う
   ===================================================== */
function handleBeansInput() {
  document.getElementById('hiddenLastInput').value = 'beans';
  onInputChange();
}

function handleVolumeInput() {
  document.getElementById('hiddenLastInput').value = 'volume';
  onInputChange();
}

/* =====================================================
   【リセット時の追加処理】
   ・common.jsのhandleReset()がresetAll()の後に自動で呼ぶ
   ・濃度を標準(1:15)に戻し、ボタン表示も同期させる
   ===================================================== */
function onResetExtra() {
  document.getElementById('hiddenStrength').value = '15';
  syncStrengthButtons();
}

/* =====================================================
   【復元後のボタン表示同期】
   ・common.jsのrestoreInputs()はhiddenStrengthの値は復元するが
     ボタンのactive表示までは面倒を見ないため、ここで同期する
   ・common.js側のDOMContentLoadedリスナーより後に登録されるため
     restoreInputs()実行後に呼ばれる
   ===================================================== */
document.addEventListener('DOMContentLoaded', syncStrengthButtons);

/* =====================================================
   【シェア用URL】
   ===================================================== */
function buildShareUrl() {
  return location.href.split('?')[0];
}

/* =====================================================
   【シェア用テキスト】
   ===================================================== */
function buildShareText(result) {
  return `☕ コーヒー豆${result.main}gで、出来上がり量${result.subB}mlのコーヒーが作れます！`;
}
</script>
</body>
